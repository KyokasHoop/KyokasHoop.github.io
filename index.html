<!DOCTYPE html>
<html>

<head>
    <title>Tapu's Lair</title>

    <style>
        body {
            background-color: #171522;
            color: white;
            font-family: Arial, sans-serif;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            background-color: #242033;

            width: 500px;
            padding: 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 0 30px #00000070;
        }

        .profile-image {
            width: 180px;
            height: 180px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #8b7cff;
        }

        h1 {
            color: #a99cff;
            margin-bottom: 5px;
        }

        .username {
            color: #aaa;
            margin-top: 0;
        }

        .about {
            line-height: 1.6;
            color: #dddddd;
        }

        .links {
            margin-top: 25px;
        }

        .button {
            display: inline-block;

            background-color: #8b7cff;
            color: white;

            padding: 12px 22px;

            border-radius: 10px;

            text-decoration: none;

            transition: 0.2s;
        }

        .button:hover {
            background-color: #a99cff;
            transform: scale(1.05);
        }
    </style>
</head>


<body>

    <div class="profile">

        <img
            class="profile-image"
            src="twitter_image.jpg"
            alt="My profile picture"
        >

        <h1>Kyoka</h1>

        <p class="username">
            Welcome to my little corner of the internet.
        </p>

        <p class="about">
            Hi! I'm Kyoka. I'm learning HTML and making my first website.
            I'll probably put stuff I like, games, music, links and random
            things here.
        </p>

        <div class="links">

            <a
                class="button"
                href="https://x.com/VeritaCordis"
                target="_blank"
            >
                Twitter
            </a>

        </div>

    </div>

</body>

</html>
