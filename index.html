<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kyoka's Lair</title>

  <style>
    :root {
      --bg: #171522;
      --card: #242033;
      --purple: #8b7cff;
      --purple-light: #a99cff;
      --text: #ffffff;
      --muted: #aaaaaa;
      --soft: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile {
      width: min(500px, calc(100% - 32px));
      padding: 32px;
      text-align: center;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 0 30px #00000070;
    }

    .profile-image {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid var(--purple);
      background-color: #332d46;
      background-image: url("profile.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 8px 24px #00000055;
    }

    h1 {
      margin: 0 0 6px;
      color: var(--purple-light);
      font-size: 2rem;
    }

    .username {
      margin: 0;
      color: var(--muted);
    }

    .about {
      margin: 24px 0 0;
      line-height: 1.6;
      color: var(--soft);
    }

    .links {
      margin-top: 28px;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      background: var(--purple);
      color: white;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .button:hover {
      background: var(--purple-light);
      transform: translateY(-2px) scale(1.03);
    }

    .button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main class="profile">
    <div
      class="profile-image"
      role="img"
      aria-label="Kyoka's profile picture"
    ></div>

    <h1>Kyoka</h1>

    <p class="username">
      Welcome to my little corner of the internet.
    </p>

    <p class="about">
      Hi! I'm Kyoka. I'm learning HTML and making my first website.
      I'll probably put stuff I like, games, music, links, and random things here.
    </p>

    <div class="links">
      <a
        class="button"
        href="https://x.com/VeritaCordis"
        target="_blank"
        rel="noopener noreferrer"
      >
        Twitter
      </a>
    </div>
  </main>
</body>
</html>
